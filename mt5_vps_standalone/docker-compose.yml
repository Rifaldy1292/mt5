services:
  mt5-bridge:
    build: .
    container_name: traderoom_mt5_bridge
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=5050
      - MT5_TOTAL_SLOTS=10
      - MT5_BUSY_THRESHOLD=10.0
    volumes:
      - ./mt5_terminals_data:/root/.wine/drive_c/MT5_Terminals
